<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com htmls</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este vídeo esta hospedado no meu proprio servidor</p>

    <video controls>
        <source src="meu-video.mp4" type="vídeo/mp4">
        <source src="meu-video.m4v" type="vídeo/mp4">
        <source src="meu-video.webm" type="vídeo/webm">
        <source src="meu-video.ogv" type="vídeo/ogv">
    </video>
    <p>o seu navegador não tem compatibilidade com a reprodução de vídeos</p>
    <p>inserindo vídeos do youtube!</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/jPWsBuiy1rE?si=sgjPtpW3ZRLCEWSy" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


    
</body>
</html>
