<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de texto</title>
</head>
<body>
    <h1>Principais Formatações</h1>
    <h2>Negrito / Destaque</h2>
    <p>Nesta frase temos um <p> termo em negrito <p>usando a tag B (não semântica).</p>
    <p>Nest frase tenho um <strong>em destaque</strong> usando a tag STRONG (Semântica)</p>
    <h2>itálico / Enfase</h2>
    <p>Nesta frase temos um <i>termo em itálico<i> usando a tag 1 (não semântica)</p>
    <p>Nesta frase temos um <em></em></p>

</body>
</html>
