<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Paragrafos e quebras de linha</h1>
    <hr>
    <p>
        É possível &lt;escrever&gt; um
        paragráfo de qualquer maneira.
        basta inserir o texto entre &lt;p&gt; e &lt;/p&gt;
        <!-- less than ; greater than -->
    </p>
    <p>
        Se eu precisar de fazer uma quebra do texto num <br>
        determinado lugar, então temos que usar a tag br.
     </p>
     <p>Vamos adicionar alguns símbolos especiais;</p>
         &reg;
         &copy;
         &trade;
         &euro;
         &pound;
         &yen;
         &cent;
         &delta;
         
</body>
</html>
